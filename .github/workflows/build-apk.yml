name: Build HISAAB Android APK
# Re-trigger build after requested fresh run
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Print debug signing fingerprint
        run: gradle :app:signingReport
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Launch app in Android emulator (startup smoke test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.kharcha.app/.MainActivity
            sleep 20
            adb shell pidof com.kharcha.app >/dev/null || { adb logcat -d -v time; exit 1; }
            adb shell dumpsys activity activities | grep -F 'com.kharcha.app/.MainActivity' || { adb logcat -d -v time; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: HISAAB-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
